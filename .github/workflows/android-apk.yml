name: Android APK

on:
  push:
    branches: [main, android-only]
    paths:
      - "android/**"
      - "scripts/prepare-android-voice.sh"
      - "ThirdParty/SherpaOnnx/**"
      - "integrations/dsh-go/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform 36 / Build-Tools 36.0.0
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Optional: reuse the existing signing key so CI builds upgrade in place.
      # Store base64 of ~/.android/debug.keystore as repository secret ANDROID_DEBUG_KEYSTORE_B64.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            # Fail early if the JDK cannot read the key the Android Gradle Plugin will use.
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
            echo "Using provided signing keystore"
          else
            echo "No keystore secret; a fresh debug key will sign this build"
          fi

      - uses: gradle/actions/setup-gradle@v4

      # Every build gets the next minor version (run 26 -> 1.3.0), used by Gradle and the uploaded file name.
      - name: Set version
        run: echo "OPENRAYNEO_VERSION_NAME=1.$((GITHUB_RUN_NUMBER - 23)).0" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          # Surface compiler/lint errors as annotations so they are readable without opening the raw log.
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # One annotation (GitHub keeps only a few per step); newlines encoded as %0A.
            msg=$( { grep -E '^e: |error:' "$RUNNER_TEMP/gradle.log"; grep -A12 'What went wrong' "$RUNNER_TEMP/gradle.log"; } | grep -v '^> Task' | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: openrayneo-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Pack DSH Go plugin
        working-directory: integrations/dsh-go
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # Optional: upload APK and plugin to a Nextcloud "file drop" (upload-only) public share.
      # Store the share link (https://host/s/TOKEN) as repository secret NEXTCLOUD_DROP_URL.
      - name: Upload to Nextcloud
        env:
          DROP_URL: ${{ secrets.NEXTCLOUD_DROP_URL }}
        run: |
          if [ -z "$DROP_URL" ]; then echo "No NEXTCLOUD_DROP_URL secret; skipping upload"; exit 0; fi
          base="${DROP_URL%%/s/*}"; token="${DROP_URL##*/s/}"; token="${token%%[/?#]*}"
          version="$OPENRAYNEO_VERSION_NAME"
          short="${GITHUB_SHA::7}"
          upload() {
            # Nextcloud 29+ public DAV first, then the legacy public WebDAV endpoint.
            curl -fsS -T "$1" -H "X-Requested-With: XMLHttpRequest" "$base/public.php/dav/files/$token/$2" \
              || curl -fsS -T "$1" -u "$token:" -H "X-Requested-With: XMLHttpRequest" "$base/public.php/webdav/$2"
            echo "Uploaded $2"
          }
          upload android/app/build/outputs/apk/release/app-release.apk "openrayneo-$version-$short.apk"
          upload "$RUNNER_TEMP"/openrayneo-dsh-*.tgz "openrayneo-dsh-$short.tgz"
